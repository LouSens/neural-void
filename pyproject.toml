# What the API needs to run when deployed (FastAPI Cloud reads this file).
# requirements.txt stays as the full local setup, including the plotting used by the training script.
[project]
name = "neural-void"
version = "1.0.0"
description = "TikTok habit analytics: a 25-feature pipeline and a three-model ensemble behind a plain-language interface"
# Pinned to 3.11: numpy 1.26 and the saved models have no pre-built packages for newer Pythons.
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "xgboost==2.1.3",
    "joblib==1.4.2",
    "google-genai==1.12.1",
    "python-dotenv==1.0.1",
]

[tool.fastapi]
entrypoint = "main:app"
